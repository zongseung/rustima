name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"  # 03:00 UTC daily
  workflow_dispatch:  # manual trigger

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: rustima

jobs:
  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Create venv and install deps
        run: |
          uv venv .venv
          uv pip install numpy statsmodels scipy pandas

      - name: Build wheel (release) and install
        run: |
          uv pip install maturin
          CARGO_TARGET_DIR=target_wheel uv run --no-project --no-sync maturin build --manifest-path packages/python/Cargo.toml --release --out /tmp/wheels
          uv pip install --force-reinstall /tmp/wheels/rustima-*.whl

      - name: Run Rust benchmarks
        run: cargo bench -p rustima-core --bench bench_fit -- --output-format bencher | tee bench_results.txt

      - name: Run Python benchmark comparison
        # 벤치 스크립트는 benchmarks/ 로 격리됨
        run: .venv/bin/python benchmarks/bench_comparison.py | tee python_bench_results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            rustima/bench_results.txt
            rustima/python_bench_results.txt
