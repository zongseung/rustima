name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-test:
    name: Shared core (Rust ${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.87.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rustima
      - name: Test core and benchmark targets
        working-directory: rustima
        run: cargo test -p rustima-core --all-targets --locked

  python-test:
    name: Python installed wheel
    runs-on: ubuntu-latest
    needs: rust-test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - name: Install build and test dependencies
        working-directory: rustima
        run: |
          uv venv .venv
          uv pip install maturin numpy polars pytest statsmodels scipy pandas
      - name: Build and install wheel
        working-directory: rustima
        run: |
          .venv/bin/maturin build --locked --release --manifest-path packages/python/Cargo.toml --out /tmp/wheels
          uv pip install --force-reinstall --no-deps /tmp/wheels/rustima-*.whl
      - name: Test installed wheel
        working-directory: rustima
        run: .venv/bin/python -m pytest packages/python/tests -o pythonpath= -m "not nightly" --tb=short

  r-check:
    name: R source package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      R_KEEP_PKG_SOURCE: yes
      RAYON_NUM_THREADS: 2
    defaults:
      run:
        shell: bash
        working-directory: rustima
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Install shell checker (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y devscripts
      - name: Install shell checker (macOS)
        if: runner.os == 'macOS'
        run: brew install checkbashisms
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'Windows' && 'x86_64-pc-windows-gnu' || '' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build standalone source package
        run: python tools/build_r_package.py
      - name: Check source package
        run: |
          mkdir -p dist/r/check
          R CMD check --no-manual --as-cran --output=dist/r/check dist/r/rustima_*.tar.gz
          python - <<'PY'
          from pathlib import Path
          log = Path("dist/r/check/rustima.Rcheck/00check.log").read_text()
          status = next(line for line in log.splitlines() if line.startswith("Status:"))
          assert "ERROR" not in status and "WARNING" not in status, status
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r-check-${{ matrix.os }}
          path: |
            rustima/dist/r/*.tar.gz
            rustima/dist/r/check/**/*.log
            rustima/dist/r/check/**/*.Rout*
