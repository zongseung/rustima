name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-test:
    name: Rust Tests (${{ matrix.backend }}, ${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, msrv]
        backend: [legacy, basin]
        include:
          - backend: legacy
            features: ""
          - backend: basin
            features: basin
    steps:
      - uses: actions/checkout@v4

      - name: Read minimum supported Rust version
        if: matrix.rust == 'msrv'
        id: msrv
        working-directory: rustima
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["package"]["rust-version"]
          print(f"version={version}")
          PY

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version || matrix.rust }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rustima/target
          key: ${{ runner.os }}-${{ steps.msrv.outputs.version || matrix.rust }}-${{ matrix.backend }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Rust tests
        working-directory: rustima
        run: cargo test --locked --all-targets --no-default-features --features "${{ matrix.features }}"

  python-test:
    name: Python Tests (${{ matrix.backend }})
    runs-on: ubuntu-latest
    needs: rust-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: legacy
            features: ""
            expect_basin: "0"
          - backend: basin
            features: basin
            expect_basin: "1"
    env:
      RUSTIMA_TEST_BASIN: ${{ matrix.expect_basin }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Create venv and install deps
        working-directory: rustima
        run: |
          uv venv .venv
          uv pip install numpy pytest statsmodels scipy pandas

      - name: Build wheel and install
        working-directory: rustima
        run: |
          uv pip install maturin
          CARGO_TARGET_DIR=target_wheel uv run --no-sync maturin build --locked --release --features "${{ matrix.features }}" --out /tmp/wheels
          uv pip install --force-reinstall /tmp/wheels/rustima-*.whl

      - name: Run Python tests (excluding nightly)
        working-directory: rustima
        # Exercise the installed wheel instead of a source-tree extension.
        run: .venv/bin/python -m pytest python_tests/ -o pythonpath= -m "not nightly" -v --tb=short
