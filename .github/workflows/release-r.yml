name: R source release

on:
  push:
    tags:
      - "r-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      RAYON_NUM_THREADS: 2
    defaults:
      run:
        shell: bash
        working-directory: rustima
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Install shell checker (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y devscripts
      - name: Install shell checker (macOS)
        if: runner.os == 'macOS'
        run: brew install checkbashisms
      - uses: r-lib/actions/setup-r@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'Windows' && 'x86_64-pc-windows-gnu' || '' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build vendored source package
        run: python tools/build_r_package.py
      - name: Check package
        run: |
          mkdir -p dist/r/check
          R CMD check --no-manual --as-cran --output=dist/r/check dist/r/rustima_*.tar.gz
          python - <<'PY'
          from pathlib import Path
          log = Path("dist/r/check/rustima.Rcheck/00check.log").read_text()
          status = next(line for line in log.splitlines() if line.startswith("Status:"))
          assert "ERROR" not in status and "WARNING" not in status, status
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r-source-${{ matrix.os }}
          path: |
            rustima/dist/r/*.tar.gz
            rustima/dist/r/check/**/*.log
            rustima/dist/r/check/**/*.Rout*
